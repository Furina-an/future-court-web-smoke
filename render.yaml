services:
  - type: web
    name: future-court-web-smoke
    runtime: static
    staticPublishPath: ./web
    headers:
      - path: /*
        name: Access-Control-Allow-Origin
        value: "*"
      - path: /*
        name: Cross-Origin-Resource-Policy
        value: cross-origin
      - path: /index.wasm
        name: Content-Type
        value: application/wasm
      - path: /index.pck
        name: Content-Type
        value: application/octet-stream
